name: Bug Report
description: Report an issue or unexpected behavior in the smart contract or SDK
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! If this is a critical security vulnerability involving escrow loss, please report it via [SECURITY.md](SECURITY.md) instead of creating a public issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Network
      description: e.g. Soroban Testnet, Local Sandbox, Soroban SDK v22.0.8, Rust 1.80.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior, contract invocations, or transaction hash.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen according to protocol invariants.
    validations:
      required: true
