[package]
name = "gig-escrow-contracts"
version = "0.1.0"
description = "Soroban smart contract for Escrow-FairLance milestone payments, dispute resolution, and arbitrator staking"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = "22.0.8"

[dev-dependencies]
soroban-sdk = { version = "22.0.8", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
